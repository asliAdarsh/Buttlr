[project]
name = "buttlr-backend"
version = "0.1.0"
description = "Buttlr — AI workforce platform backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.2",
  "PyJWT>=2.9.0",
  "apscheduler>=3.10.4",
  "tenacity>=9.0.0",
  "cryptography>=43.0.0",
  "openai>=1.54.0",
  "anthropic>=0.39.0",
  "firebase-admin>=6.5.0",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",
    "E501",
    # Enums stay `(str, Enum)` on purpose: the wire format and Firestore both key off
    # `.value`, and `StrEnum` would change `str(member)` semantics under the frozen contract.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
